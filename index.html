<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skill Challenge Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&display=swap">
<style>
/* neutral palette: off-white page, white cards, one blue accent, red only for Subscribe */
:root{--bg:#f6f6f3;--card:#ffffff;--cell:#f1f1ed;--edge:#e4e4de;--blue:#2f43c7;--on:#ffffff;--soft:#dde1f8;--ink:#17171c;--muted:#6a6a64;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Noto Sans Tamil",system-ui,sans-serif;font-size:16px;line-height:1.6;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
.wrap .wrap{width:100%;margin:0}
.modal{position:fixed;inset:0;background:rgba(23,23,28,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal .box{background:var(--card);border-radius:16px;padding:22px;max-width:380px;width:100%}
.modal h2{margin-bottom:8px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.2;margin:0;font-weight:700;color:var(--ink);text-wrap:balance}
h2{font-size:1rem;margin:0 0 12px;font-weight:600;color:var(--ink)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:20px;min-width:0}
label{display:block;font-weight:600;margin-bottom:8px}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid #c9c9c2;border-radius:10px;padding:10px 12px;width:100%;resize:vertical;margin-bottom:12px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid #c9c9c2;border-radius:10px;padding:10px 12px;max-width:100%}
input[type=text],input[type=password]{width:100%;margin-bottom:12px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--blue);color:var(--on)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--edge);padding:8px 14px;font-size:.9rem}
button.opt{flex:1 1 200px;border:1px solid var(--edge);background:var(--card);color:var(--ink);padding:14px 16px}
button.opt.on-ok{background:var(--blue);color:var(--on);border-color:var(--blue)}
button.opt.on-need{background:var(--soft);color:var(--ink);border-color:var(--soft)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.err{color:#a0123a;font-weight:600;font-size:.9rem;margin-bottom:10px}
/* welcome */
#welcome{min-height:80vh;justify-content:center}
.hero{text-align:left}
.hero .tag{font-size:1.05rem;margin-top:10px}
.langtog{display:inline-flex;border:1px solid var(--edge);background:var(--card);border-radius:10px;overflow:hidden}
.langtog button{border-radius:0;background:transparent;color:var(--muted);padding:6px 14px;font-size:.85rem}
.langtog button[aria-pressed=true]{background:var(--blue);color:var(--on)}
.modetog{display:flex;width:100%}.modetog button{flex:1;padding:10px 14px;font-size:.95rem}
/* nav */
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:4px}
.nav button{background:transparent;color:var(--muted);padding:9px 6px;font-size:.9rem}
.nav button[aria-current=page]{background:var(--blue);color:var(--on)}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:12px;text-align:center;min-width:0}
.stat b{display:block;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--blue)}
.stat span{font-size:.75rem;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.note{border-radius:14px;padding:12px 16px;background:var(--card);border:1px solid var(--edge)}
.note.warn{border-color:var(--blue)}
.quote{border-left:4px solid var(--blue);padding:12px 16px;background:var(--cell);border-radius:0 12px 12px 0;font-size:1.05rem;font-weight:600;margin-top:14px}
.quote.need{border-left-color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cell{border-radius:14px;border:2px solid transparent;background:var(--cell);color:var(--ink);padding:6px 2px;font-weight:400;font-size:.8rem;line-height:1.25;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;font-variant-numeric:tabular-nums}
.cell b{font-size:1.05rem}
.cell small{color:inherit;opacity:.75;font-size:.68rem}
.cell.ok{background:var(--blue);color:var(--on)}
.cell.need{background:var(--soft);color:var(--ink)}
.cell.miss{border:2px dashed #c4c4bc;background:transparent}
.cell.fut{opacity:.45}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
a.sub{display:inline-flex;align-items:center;background:#e62117;color:#fff;font-weight:600;text-decoration:none;border-radius:12px;padding:10px 18px}
/* achievements */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;font-size:17px;fill:var(--muted)}
svg.chart .val{fill:var(--blue);font-weight:700;font-size:19px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--edge);border-radius:14px;padding:14px 12px;background:var(--card);text-align:center}
.badge b{display:block;font-size:1.4rem;color:var(--blue)}
.badge.lock{opacity:.5}
.badge.got{background:var(--soft);border-color:var(--soft);color:var(--ink)}
.badge.got b{color:var(--blue)}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h2{margin:0;text-align:center;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:.72rem;color:var(--muted);padding-bottom:2px}
.c,button.c{aspect-ratio:1;border-radius:12px;background:var(--cell);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;font-weight:400;min-width:0;border:2px solid transparent;font-variant-numeric:tabular-nums;padding:0;line-height:1.1}
.c svg{width:15px;height:15px;margin-top:2px}
.c.ok,button.c.ok{background:#e1f3e8;color:#0d6a38}
.c.no,button.c.no{background:#fbe4e3;color:#a11d17}
.c.out{background:transparent;opacity:.35}
.c.blank{visibility:hidden}
.c.today,button.c.today{border-color:var(--blue);font-weight:700}
button.c.today{cursor:pointer}
.legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;margin-top:12px}
.legend2 svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.opts button{background:var(--card);color:var(--ink);border:1px solid var(--edge);padding:14px 10px}
.opts button[aria-pressed=true]{background:var(--blue);color:var(--on);border-color:var(--blue)}
.opts button:disabled{opacity:.4}
.noteList{display:flex;flex-direction:column;gap:10px}
.noteItem{border-left:4px solid var(--blue);background:var(--cell);border-radius:0 12px 12px 0;padding:10px 14px}
.noteItem b{display:block;font-size:.8rem;color:var(--muted);font-weight:600}
.okbox{color:#0d6a38;font-weight:600}
input[type=number],input[type=date]{width:100%;margin-bottom:12px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head>
<body>
<div class="wrap">

  <!-- WELCOME / LOGIN -->
  <div id="welcome" class="wrap">
    <div class="row between"><span></span>
      <div class="langtog" role="group" aria-label="Language"><button type="button" data-lang="en">English</button><button type="button" data-lang="ta">தமிழ்</button></div>
    </div>
    <div class="hero">
      <h1 data-i="welcomeTitle"></h1>
      <p class="tag muted" data-i="welcomeSub"></p>
    </div>
    <section class="card">
      <div class="langtog modetog" role="group" aria-label="Log in or create account" style="margin-bottom:16px">
        <button type="button" data-mode="login" data-i="login"></button><button type="button" data-mode="signup" data-i="signup"></button>
      </div>
      <label for="un" data-i="username"></label>
      <input type="text" id="un" autocomplete="username" autocapitalize="none" maxlength="20">
      <label for="pw" data-i="password"></label>
      <input type="password" id="pw" autocomplete="current-password" minlength="6">
      <div id="cpWrap" hidden>
        <label for="cpw" data-i="confirmPw"></label>
        <input type="password" id="cpw" autocomplete="new-password" minlength="6">
      </div>
      <p class="err" id="authErr" role="alert"></p>
      <div class="row"><button type="button" id="authBtn"></button></div>
      <p class="small muted" style="margin-top:12px" data-i="noReset"></p>
    </section>
  </div>

  <!-- APP -->
  <div id="shell" class="wrap" hidden>
    <header>
      <h1 data-i="title"></h1>
      <p class="muted" id="hello" style="margin-top:6px"></p>
    </header>
    <nav class="nav" aria-label="Main">
      <button type="button" data-tab="dash" data-i="tabDash"></button>
      <button type="button" data-tab="ach" data-i="tabAch"></button>
      <button type="button" data-tab="set" data-i="tabSet"></button>
    </nav>

    <!-- DASHBOARD -->
    <section id="v-dash" class="wrap">
      <div class="card" id="setup1" hidden>
        <label for="start" data-i="startQ"></label>
        <input type="date" id="start">
        <p class="err" id="startErr" role="alert"></p>
        <button type="button" id="startNext" data-i="next"></button>
        <p class="small muted" style="margin-top:10px" data-i="startHint"></p>
      </div>
      <div class="card" id="setup2" hidden>
        <h2 data-i="goalQ"></h2>
        <div id="pk-setup"></div>
        <button type="button" class="ghost" id="setupBack" data-i="back" style="margin-top:12px"></button>
      </div>
      <div id="app" class="wrap">
        <div class="stats">
          <div class="stat"><b id="sDone">0</b><span data-i="sDone"></span></div>
          <div class="stat"><b id="sCur">0</b><span data-i="sCur"></span></div>
          <div class="stat"><b id="sBest">0</b><span data-i="sBest"></span></div>
          <div class="stat"><b id="sLeft">0</b><span data-i="sLeft"></span></div>
        </div>
        <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
        <div id="msg"></div>
        <section class="card">
          <div class="cal-head">
            <button type="button" class="ghost" id="mPrev" aria-label="Previous month">&larr;</button>
            <h2 id="monthTitle"></h2>
            <button type="button" class="ghost" id="mNext" aria-label="Next month">&rarr;</button>
          </div>
          <div class="cal" id="dow"></div>
          <div class="cal" id="cal" style="margin-top:6px"></div>
          <div class="legend2">
            <span><span class="okbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span data-i="lgOk"></span></span>
            <span><span style="color:#a11d17"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></span><span data-i="lgSkip"></span></span>
          </div>
        </section>
        <div id="chain" class="note"></div>
        <section class="card" id="todayCard">
          <h2 id="dTitle"></h2>
          <div id="todayBody"></div>
        </section>
        <section class="card">
          <h2 data-i="cmTitle"></h2>
          <textarea id="cmText" rows="3" maxlength="500"></textarea>
          <div class="row"><button type="button" id="cmSend" data-i="cmSend"></button><span class="small muted" id="cmMsg" role="status"></span></div>
        </section>
        <p class="small muted" id="saveNote"></p>
      </div>
    </section>

    <!-- PROGRESS -->
    <section id="v-ach" class="wrap" hidden>
      <div id="achEmpty" class="note" hidden data-i="achEmpty"></div>
      <div id="achBody" class="wrap">
        <section class="card"><h2 data-i="chWeek"></h2><p class="small muted" data-i="chWeekD" style="margin-bottom:8px"></p><div id="chartWeek"></div></section>
        <section class="card"><h2 data-i="badges"></h2><div class="badges" id="badges"></div></section>
        <section class="card"><h2 data-i="notesTitle"></h2><div class="noteList" id="notesList"></div></section>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="v-set" class="wrap" hidden>
      <section class="card">
        <h2 data-i="language"></h2>
        <div class="langtog" role="group" aria-label="Language"><button type="button" data-lang="en">English</button><button type="button" data-lang="ta">தமிழ்</button></div>
      </section>
      <section class="card" id="setStartCard">
        <h2 data-i="startDate"></h2>
        <p class="small muted" id="startShow" style="margin-bottom:12px"></p>
        <input type="date" id="newStart">
        <p class="err" id="newStartErr" role="alert"></p>
        <button type="button" class="ghost" id="newStartBtn" data-i="changeStart"></button>
      </section>
      <section class="card" id="setGoalCard">
        <h2 data-i="changeGoal"></h2>
        <p class="small muted" id="goalShow" style="margin-bottom:12px"></p>
        <div id="pk-set"></div>
      </section>
      <section class="card">
        <h2 data-i="account"></h2>
        <p id="acct" style="margin-bottom:12px"></p>
        <button type="button" class="ghost" id="logoutBtn" data-i="logout"></button>
      </section>
      <section class="card">
        <a class="sub" href="https://www.youtube.com/@esaiprabakar?sub_confirmation=1" target="_blank" rel="noopener" data-i="subscribe"></a>
      </section>
    </section>
  </div>
</div>

<div class="modal" id="popup" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
  <div class="box">
    <h2 id="pTitle" data-i="popTitle"></h2>
    <p class="muted" data-i="popBody" style="margin-bottom:16px"></p>
    <div class="row"><button type="button" id="popOk" data-i="popOk"></button></div>
  </div>
</div>

  function t(k,o){var s=(L[lang]&&L[lang][k]!=null)?L[lang][k]:L.en[k]; if(typeof s==='string'&&o){for(var p in o)s=s.split('{'+p+'}').join(o[p]);} return s;}

  function stats(){

    var W=600,H=220,pl=34,pr=8,pt=28,pb=34,pw=W-pl-pr,ph=H-pt-pb,slot=pw/weeks,bw=Math.min(46,slot*.62),g='';

    $('mPrev').disabled=(vy*12+vm)<=sm; $('mNext').disabled=(vy*12+vm)>=em;
    var dh='',i; for(i=0;i<7;i++){dh+='<div class="dow">'+fmt(new Date(2023,0,1+i),{weekday:'short'})+'</div>';} $('dow').innerHTML=dh;
    var first=new Date(vy,vm,1), dim=new Date(vy,vm+1,0).getDate(), h='';
    for(i=0;i<first.getDay();i++)h+='<div class="c blank"></div>';
    for(i=1;i<=dim;i++){
      var d=new Date(vy,vm,i), k=ymd(d), inR=d>=s&&d<=e, isT=k===tk, cls='c', icon='', lab=fmt(d,{day:'numeric',month:'long'});
      if(!inR)cls+=' out';
      else if(state.days[k]==='done'){cls+=' ok';icon=TICK;lab+=', '+t('lgOk');}
      else if(d<tt){cls+=' no';icon=CROSS;lab+=', '+t('lgSkip');}
      if(isT)cls+=' today';
      if(isT&&inR)h+='<button type="button" class="'+cls+'" data-today="1" aria-label="'+lab+' ('+t('today')+')"><span>'+i+'</span>'+icon+'</button>';
      else h+='<div class="'+cls+'" aria-label="'+lab+'"><span>'+i+'</span>'+icon+'</div>';
    }
    $('cal').innerHTML=h;

    /* chain message */
    var cm='';
    if(dayDiff(s,tt)<0)cm='';
    else if(st.cur>=1)cm=t('chainOk',{n:st.cur})+(hasT?'':' '+t('chainTick'));
    else if(st.n<=1&&!hasT)cm=t('chainStart');
    else if(!hasT&&has1&&!y1)cm=t('chainBroke');
    else if(hasT)cm=t('chainOk',{n:Math.max(1,st.cur)});
    else cm=t('chainStart');
    $('chain').hidden=!cm;$('chain').textContent=cm;

    /* today card */
    $('dTitle').textContent=t('todayTitle',{d:fmt(tt,{day:'numeric',month:'short',year:'numeric'})});
    var tb=$('todayBody'), inRange=tt>=s&&tt<=e; tb.innerHTML='';
    function el(tag,cls,txt){var x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x;}
    if(!inRange){tb.appendChild(el('p','muted',dayDiff(s,tt)<0?t('notStarted',{d:fmt(s,{day:'numeric',month:'short',year:'numeric'})}):t('over',{n:st.done})));return;}
    if(hasT){
      tb.appendChild(el('p','okbox',t('doneToday')));
      var nt=state.notes[tk]; if(nt){var nb=el('div','noteItem');nb.appendChild(el('b',null,t('yourNote')));nb.appendChild(el('span',null,nt));nb.style.marginTop='10px';tb.appendChild(nb);}
      tb.appendChild(el('p','quote',pick('doneQ',tk+state.start)));
      return;
    }
    if(!noteOpen){
      var r=el('div','row'), b1=el('button',null,t('didBtn')), b2=el('button','ghost',t('forYou'));
      b1.type='button';b2.type='button';
      b1.addEventListener('click',function(){noteOpen=true;forShown=false;renderDash();var ta=$('noteText');if(ta)ta.focus();});
      b2.addEventListener('click',function(){forN=forShown?forN+1:Math.floor(Math.random()*8);forShown=true;renderDash();});
      r.appendChild(b1);r.appendChild(b2);tb.appendChild(r);
      if(forShown)tb.appendChild(el('p','quote need',t('needQ')[forN%t('needQ').length]));
    }else{
      var lab=el('label',null,t('noteQ'));lab.setAttribute('for','noteText');
      var ta=document.createElement('textarea');ta.id='noteText';ta.rows=3;ta.maxLength=300;ta.placeholder=t('notePh');
      var er=el('p','err');er.id='noteErr';er.setAttribute('role','alert');
      var rr=el('div','row'), sb1=el('button',null,t('noteSubmit')), cb=el('button','ghost',t('cancel'));
      sb1.type='button';cb.type='button';
      sb1.addEventListener('click',function(){
        var v=ta.value.trim(); if(!v){er.textContent=t('noteEmpty');return;}
        state.days[tk]='done';state.notes[tk]=v;noteOpen=false;forShown=false;save();render();$('popup').hidden=false;$('popOk').focus();
      });
      cb.addEventListener('click',function(){noteOpen=false;renderDash();});
      rr.appendChild(sb1);rr.appendChild(cb);
      tb.appendChild(lab);tb.appendChild(ta);tb.appendChild(er);tb.appendChild(rr);
    }
  }

  function render(){
    var loggedIn=!!uid;
    $('welcome').hidden=loggedIn;$('shell').hidden=!loggedIn;
    if(!loggedIn)return;
    $('hello').textContent=state.start?t('hi',{n:uname||'',g:goalLabel()}):'';
    var tabs=document.querySelectorAll('[data-tab]');
    for(var i=0;i<tabs.length;i++){var on=tabs[i].getAttribute('data-tab')===tab;if(on)tabs[i].setAttribute('aria-current','page');else tabs[i].removeAttribute('aria-current');}
    $('v-dash').hidden=tab!=='dash';$('v-ach').hidden=tab!=='ach';$('v-set').hidden=tab!=='set';
    if(tab==='dash')renderDash();
    if(tab==='ach')renderAch();
    if(tab==='set'){
      $('acct').textContent=uname;
      var has=!!state.start; $('setStartCard').hidden=!has;$('setGoalCard').hidden=!has;
      if(has){
        var td=ymd(today()), mn=state.start;
        $('startShow').textContent=t('startOn',{d:fmt(parse(state.start),{day:'numeric',month:'short',year:'numeric'})});
        $('newStart').min=mn; if(!$('newStart').value||$('newStart').value<mn)$('newStart').value=mn;
        $('goalShow').textContent=t('goalNow',{g:goalLabel(),e:fmt(goalEnd(),{day:'numeric',month:'short',year:'numeric'})});
        if(pk.set.g==='jan1'&&state.goal){pk.set.g=state.goal.t;pk.set.n=state.goal.n||'';}
        renderPicker('pk-set','set',state.start,'saveGoal',function(goal){state.goal=goal;vy=null;save();$('pk-set-e').textContent='';render();$('pk-set-e').textContent=t('goalSaved');});
      }
    }
  }

  /* ---------- auth ---------- */
  function fake(u){return 'u_'+u+'@skillchallenge.app';}
  function err(m){$('authErr').textContent=m||'';}
  async function afterAuth(user){
    uid=user.id;uname=(user.user_metadata&&user.user_metadata.username)||'';
    var r=await sb.from('progress').select('start_date,days').eq('user_id',uid).maybeSingle();
    state=r.data?unpack(r.data.start_date,r.data.days):blank();
    pk.set={g:state.goal.t,n:state.goal.n||''};pk.setup={g:'jan1',n:''};
    vy=null;tab='dash';pendStart=null;noteOpen=false;forShown=false;
    $('saveNote').textContent=t('saved');
    render();
  }
  async function auth(signup){
    err('');var u=$('un').value.trim().toLowerCase(),p=$('pw').value;
    if(!/^[a-z0-9_]{3,20}$/.test(u)){err(t('errU'));return;}
    if(p.length<6){err(t('errP'));return;}
    if(signup&&p!==$('cpw').value){err(t('mismatch'));return;}
    var r=signup?await sb.auth.signUp({email:fake(u),password:p,options:{data:{username:u}}}):await sb.auth.signInWithPassword({email:fake(u),password:p});
    if(r.error){err(/already|registered/i.test(r.error.message)?t('taken'):(/invalid login/i.test(r.error.message)?t('wrong'):r.error.message));return;}
    if(!r.data.session){err(t('confirmOff'));return;}
    $('pw').value='';$('cpw').value='';await afterAuth(r.data.user);
  }

  /* ---------- events ---------- */
  $('authBtn').addEventListener('click',function(){auth(mode==='signup');});
  $('pw').addEventListener('keydown',function(e){if(e.key==='Enter'&&mode==='login')auth(false);});
  $('cpw').addEventListener('keydown',function(e){if(e.key==='Enter')auth(true);});
  $('logoutBtn').addEventListener('click',async function(){await sb.auth.signOut();uid=null;uname='';state=blank();pendStart=null;render();});
  document.addEventListener('click',function(ev){
    var md=ev.target.closest&&ev.target.closest('[data-mode]'); if(md){setMode(md.getAttribute('data-mode'));return;}
    var lb=ev.target.closest&&ev.target.closest('[data-lang]'); if(lb){setLang(lb.getAttribute('data-lang'));return;}
    var tb=ev.target.closest&&ev.target.closest('[data-tab]'); if(tb){tab=tb.getAttribute('data-tab');render();}
  });
  $('startNext').addEventListener('click',function(){
    var v=$('start').value; $('startErr').textContent='';
    if(!v){$('startErr').textContent=t('startNeed');return;}
    if(v<ymd(today())){$('startErr').textContent=t('startPast');return;}
    pendStart=v;render();
  });
  $('setupBack').addEventListener('click',function(){pendStart=null;render();});
  $('cal').addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('button[data-today]'); if(b){$('todayCard').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});}});
  $('mPrev').addEventListener('click',function(){vm--;if(vm<0){vm=11;vy--;}renderDash();});
  $('mNext').addEventListener('click',function(){vm++;if(vm>11){vm=0;vy++;}renderDash();});
  $('popOk').addEventListener('click',function(){$('popup').hidden=true;});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('popup').hidden)$('popup').hidden=true;});
  $('newStartBtn').addEventListener('click',function(){
    var v=$('newStart').value, er=$('newStartErr'); er.textContent='';
    if(!v){er.textContent=t('startNeed');return;}
    if(v<state.start){er.textContent=t('startMin',{d:state.start});return;}
    state.start=v; vy=null; save(); render(); $('newStartErr').textContent=t('startSaved');
  });
  $('cmSend').addEventListener('click',async function(){
    var m=$('cmText').value.trim(); if(!m){$('cmMsg').textContent=t('cmEmpty');return;}
    $('cmSend').disabled=true;
    var r=await sb.from('comments').insert({user_id:uid,username:uname,message:m});
    $('cmSend').disabled=false;
    if(r.error){$('cmMsg').textContent=t('cmFail')+' ('+(r.error.message||r.error.code||'')+')';return;}
    $('cmText').value='';$('cmMsg').textContent=t('cmSent');
  });

  var d0=ymd(today()); $('start').min=d0; $('start').value=d0;
  try{var sl=localStorage.getItem(LKEY);if(sl==='ta'||sl==='en')lang=sl;}catch(e){}
  applyLang();
  sb.auth.getSession().then(function(r){if(r.data&&r.data.session)afterAuth(r.data.session.user);});
})();
</script>
</body></html>
